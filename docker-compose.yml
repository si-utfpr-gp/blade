services:
  app:
    build:
      context: .
      dockerfile: docker/development.Dockerfile

    container_name: blade_app

    working_dir: /rails

    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules

    ports:
      - "3000:3000"

    environment:
      RAILS_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: blade_development

      # Google OAuth. Values come from a .env file, which docker compose reads
      # automatically and which is already gitignored.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Comma separated. Empty accepts any Google account.
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      # Set to true to exercise the real login screen on localhost instead of
      # the automatic development user.
      FORCE_GOOGLE_LOGIN: ${FORCE_GOOGLE_LOGIN:-}

    depends_on:
      postgres:
        condition: service_healthy

    stdin_open: true
    tty: true

    command:
    - bash
    - -c
    - |
        bundle check || bundle install
        yarn install
        bin/rails db:prepare
        rm -f tmp/pids/server.pid
        exec bin/dev

  postgres:
    image: postgres:16-alpine

    container_name: blade_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blade_development

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  bundle_cache:
  node_modules: